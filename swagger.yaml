                          status: "Online"
        '400':
          description: "Ungültiger Parameter"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "API-Key erforderlich oder ungültig"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Kein Gateway gefunden"
