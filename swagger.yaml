  /ngsi-ld/entities/{type}:
    get:
      operationId: listDevicesByTypeNGSILD
      tags: ["Geräte"]
      summary: "Erhalte Geräte eines spezifischen Typs im NGSI-LD-Format"
      description: |
        Filtert NGSI-LD-Entitäten nach Gerätetyp. `type` ist einer der Werte `sensebox`, `waterlevel`, `temperature` oder `moisture`.
      parameters:
        - name: x-api-key
          in: header
          required: false
          schema:
            type: string
          description: "API-Key für detaillierte Attribute (z.B. interne Metadaten); ohne Key werden nur freigegebene Attribute ausgegeben."
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [sensebox, waterlevel, temperature, moisture]
          description: "Gerätetyp"
      responses:
        '200':
          description: "NGSI-LD-Entitäten des Gerätetyps"
          content:
            application/ld+json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: "Ungültiger Gerätetyp"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "API-Key erforderlich oder ungültig für angeforderte Detailinformationen."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Kein Gerät für den Typ gefunden."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ngsi-ld/entities/{type}/{id}:
    get:
      operationId: getDeviceNGSILD
      tags: ["Geräte"]
      summary: "Erhalte ein Gerät im NGSI-LD-Format"
      description: |
        Liefert eine einzelne NGSI-LD-Geräteentität. `type` ist einer der Werte `sensebox`, `waterlevel`, `temperature` oder `moisture`.
      parameters:
        - name: x-api-key
          in: header
          required: false
          schema:
            type: string
          description: "API-Key für detaillierte Attribute (z.B. interne Metadaten); ohne Key werden nur freigegebene Attribute ausgegeben."
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [sensebox, waterlevel, temperature, moisture]
          description: "Gerätetyp"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Geräte-ID oder Measurement-Name"
      responses:
        '200':
          description: "NGSI-LD-Geräteentität"
          content:
            application/ld+json:
              schema:
                type: object
        '400':
          description: "Ungültiger Gerätetyp"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "API-Key erforderlich oder ungültig für angeforderte Detailinformationen."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Kein Gerät für die Kombination aus Typ und ID gefunden."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /geojson/gateways:
    get:
      operationId: listGatewaysGeoJSON
      tags: ["Geräte"]
      summary: "Erhalte Gateways im GeoJSON-Format"
      description: |
        Liefert alle bekannten Gateways als GeoJSON-FeatureCollection. Status basiert auf den letzten Status-/Uplink-Zeitpunkten.
      parameters:
        - name: x-api-key
          in: header
          required: false
          schema:
            type: string
          description: "API-Key für detaillierte Attribute (z. B. interne Metadaten)."
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: "Gateway-ID (optional)"
      responses:
        '200':
          description: "GeoJSON-FeatureCollection mit Gateways"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJSONResponse'
              examples:
                gatewayExample:
                  value:
                    type: "FeatureCollection"
