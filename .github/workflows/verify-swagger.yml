name: Verify Swagger UI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Swagger UI artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned release and generated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          # Die Freigabe kommt aus den Repository-Einstellungen, nicht aus dem PR.
          SWAGGER_UI_SECURITY_EXCEPTION: ${{ vars.SWAGGER_UI_SECURITY_EXCEPTION }}
        run: |
          set -euo pipefail

          release_tag=$(<swagger-ui.version)
          release_commit=$(<swagger-ui.commit)

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Unexpected Swagger UI release tag: $release_tag" >&2
            exit 1
          fi
          if [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Swagger UI release commit: $release_commit" >&2
            exit 1
          fi

          read -r object_type resolved_commit <<< "$(gh api "repos/swagger-api/swagger-ui/git/ref/tags/$release_tag" --jq '.object | [.type, .sha] | @tsv')"
          for _ in {1..5}; do
            if [[ "$object_type" == "commit" ]]; then
              break
            fi
            if [[ "$object_type" != "tag" ]]; then
              echo "Swagger UI release tag does not resolve to a commit" >&2
              exit 1
            fi
            read -r object_type resolved_commit <<< "$(gh api "repos/swagger-api/swagger-ui/git/tags/$resolved_commit" --jq '.object | [.type, .sha] | @tsv')"
          done

          if [[ "$object_type" != "commit" || "$resolved_commit" != "$release_commit" ]]; then
            echo "Pinned commit does not match release tag $release_tag" >&2
            exit 1
          fi

          published_at=$(gh release view "$release_tag" --repo swagger-api/swagger-ui --json publishedAt --jq '.publishedAt')
          python3 - "$published_at" "$release_tag" "$release_commit" <<'PY'
          from datetime import datetime, timedelta, timezone
          import json
          import os
          import sys
          from urllib.parse import urlsplit

          def timestamp(value):
              parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if parsed.tzinfo is None:
                  raise ValueError("Zeitstempel ohne Zeitzone")
              return parsed

          now = datetime.now(timezone.utc)
          published = timestamp(sys.argv[1])
          if published <= now - timedelta(days=7):
              sys.exit(0)

          # Nur die Altersfrist darf für den exakt freigegebenen Fix entfallen.
          try:
              approval = json.loads(os.environ.get("SWAGGER_UI_SECURITY_EXCEPTION", ""))
              fields = ("tag", "commit", "advisory", "reason", "expires_at")
              if not isinstance(approval, dict) or any(
                  not isinstance(approval.get(key), str) or not approval[key].strip()
                  for key in fields
              ):
                  raise ValueError("Unvollständige Sicherheitsfreigabe")
              advisory = urlsplit(approval["advisory"])
              if (
                  approval["tag"] != sys.argv[2]
                  or approval["commit"] != sys.argv[3]
                  or advisory.scheme != "https"
                  or not advisory.hostname
                  or advisory.username is not None
                  or advisory.password is not None
                  or not published <= now < timestamp(approval["expires_at"]) <= published + timedelta(days=7)
              ):
                  raise ValueError("Sicherheitsfreigabe passt nicht oder ist abgelaufen")
          except (ValueError, TypeError) as error:
              print(f"Swagger UI ist jünger als 168 Stunden; gültige Sicherheitsfreigabe fehlt: {error}", file=sys.stderr)
              sys.exit(1)
          print("Die versionsgebundene Sicherheitsfreigabe ersetzt ausschließlich die Altersfrist.")
          PY

          work_dir=$(mktemp -d)
          trap 'rm -rf "$work_dir"' EXIT
          archive="$work_dir/swagger-ui.tar.gz"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output "$archive" \
            "https://api.github.com/repos/swagger-api/swagger-ui/tarball/$release_commit"

          archive_root=$(tar -tzf "$archive" | sed -n '1p' | cut -f1 -d"/")
          if [[ -z "$archive_root" ]]; then
            echo "Swagger UI archive is empty" >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$work_dir" --strip-components=1 "$archive_root/dist"
          mv "$work_dir/dist/index.html" "$work_dir/index.html"
          sed "s|https://petstore.swagger.io/v2/swagger.json|swagger.yaml|g" "$work_dir/dist/swagger-initializer.js" > "$work_dir/swagger-initializer.js"
          mv "$work_dir/swagger-initializer.js" "$work_dir/dist/swagger-initializer.js"
          sed \
            -e "s|href=\"./|href=\"dist/|g" \
            -e "s|src=\"./|src=\"dist/|g" \
            -e "s|href=\"index|href=\"dist/index|g" \
            "$work_dir/index.html" > "$work_dir/index.generated.html"
          mv "$work_dir/index.generated.html" "$work_dir/index.html"

          diff -u index.html "$work_dir/index.html"
          diff -ru dist "$work_dir/dist"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: npm-Version aus der Projektkonfiguration verwenden
        working-directory: .github
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').devDependencies.npm")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global --prefix "$RUNNER_TEMP/npm" --ignore-scripts --min-release-age=7 "npm@$version"
          printf '%s\n' "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - name: Statische API-Dokumentation im Browser prüfen
        working-directory: .github
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm audit signatures
          npx --no-install playwright install --with-deps chromium
          npm test

  merge-update:
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'master' &&
      ((github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]') ||
       (github.actor == format('{0}[bot]', vars.MAINTENANCE_APP_SLUG) &&
        github.event.pull_request.user.login == format('{0}[bot]', vars.MAINTENANCE_APP_SLUG) &&
        github.event.pull_request.head.ref == 'swagger-ui-updates'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      pages: write
    concurrency:
      group: update-integration
      queue: max
      cancel-in-progress: false
    steps:
      # Kein Checkout und keine Ausführung von PR-Code mit Schreibrechten.
      - name: Signierte Dependabot-Metadaten prüfen
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ github.token }}
      - name: Geprüftes Update übernehmen und Pages-Veröffentlichung anfordern
        if: >-
          github.event.pull_request.user.login == format('{0}[bot]', vars.MAINTENANCE_APP_SLUG) ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          IS_SWAGGER: ${{ github.event.pull_request.user.login == format('{0}[bot]', vars.MAINTENANCE_APP_SLUG) }}
          MAINTENANCE_BOT: ${{ format('{0}[bot]', vars.MAINTENANCE_APP_SLUG) }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          author='dependabot[bot]'
          allowed='^\.github/(workflows/[^/]+\.yml|package(-lock)?\.json)$'
          if [ "$IS_SWAGGER" = true ]; then
            author="$MAINTENANCE_BOT"
            allowed='^(index\.html|dist/.+|swagger-ui\.(version|commit))$'
            jq -e '.head.ref == "swagger-ui-updates"' <<< "$pr" > /dev/null
            current=$(gh api "repos/$GH_REPO/contents/swagger-ui.version?ref=master" --jq .content | base64 --decode)
            candidate=$(gh api "repos/$GH_REPO/contents/swagger-ui.version?ref=$EXPECTED_SHA" --jq .content | base64 --decode)
            if [ "${current%%.*}" != "${candidate%%.*}" ]; then
              echo 'Der Major-Wechsel bleibt als geprüfter PR zur Entscheidung offen.'
              exit 0
            fi
          fi
          jq -e --arg author "$author" --arg repo "$GH_REPO" --arg sha "$EXPECTED_SHA" \
            '.state == "open" and .draft == false and .user.login == $author and .base.ref == "master" and .head.repo.full_name == $repo and .head.sha == $sha' <<< "$pr" > /dev/null
          files=$(gh pr diff "$PR_NUMBER" --name-only)
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -Evq "$allowed"; then
            echo 'Das Update enthält Änderungen außerhalb der vorgesehenen Dateien.'
            exit 0
          fi
          if [ "$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq .object.sha)" != "$EXPECTED_BASE" ]; then
            echo 'Die Basis hat sich geändert; ein aktueller PR-Prüflauf ist erforderlich.'
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$EXPECTED_SHA" \
            --subject "Abhängigkeiten aktualisiert (#$PR_NUMBER)" --body ""
          echo 'Update übernommen; Pages-Veröffentlichung wird angefordert.'
          gh api --method POST "repos/$GH_REPO/pages/builds" > /dev/null
